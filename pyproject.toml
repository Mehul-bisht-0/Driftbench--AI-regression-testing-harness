[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftbench"
version = "0.1.0"
description = "Regression and flakiness testing for LLM agents. pytest for agent behaviour."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["anthropic>=1.0.0"]
dev = ["pytest>=8.0"]

[project.scripts]
driftbench = "driftbench.cli:main"

[tool.setuptools.packages.find]
include = ["driftbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
